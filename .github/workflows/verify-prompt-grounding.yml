name: Verify prompt-grounding correction
on:
  push:
    branches: [improve/detail-aware-replies]
    paths: ['.github/workflows/verify-prompt-grounding.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/improve/detail-aware-replies'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Remove irrelevant illustrative duration with exact hash checks
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('rrw_quality.py')
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == '9119f14a910189ddb8a45e7438ce394b1ef34c80e8befcd7af266355fed8e79e'
          old = "'do not soften 25 minutes to a long wait. Mention one praised detail in mixed feedback. '"
          new = ("'do not replace a stated quantity with vague wording. Do not add any number or duration '\n"
                 "          'unless it occurs in the current review; an empty quantity list is not permission to guess. '\n"
                 "          'Mention one praised detail in mixed feedback. '")
          text = original.decode('utf-8')
          assert text.count(old) == 1
          result = text.replace(old, new).encode('utf-8')
          assert hashlib.sha256(result).hexdigest() == '147fb9d4349f587d7cc74493c5a8cf096984f1150f9e0ec9313c8e65d0e1d7df'
          path.write_bytes(result)
          PY
      - name: Verify every regression before committing
        run: |
          mkdir -p evidence
          set -o pipefail
          python -m unittest -v 2>&1 | tee evidence/tests.txt
          python check_submission.py | tee evidence/development-check.txt
          git diff --check
          python rrw_evaluate.py --mode offline --suite full --data-dir evidence/final-template-workspace > evidence/template-results.txt
      - name: Commit verified prompt only to the development branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rrw_quality.py
          git commit -m 'Remove numeric prompt example that leaked into unrelated model replies'
          git push origin HEAD:improve/detail-aware-replies
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=evidence/tested-source.zip HEAD
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: prompt-grounding-integration-${{ github.sha }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
  live:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Retest all three fictional reviews with real Gemma
        timeout-minutes: 10
        env:
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_CONTEXT_LENGTH: '4096'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: ${{ runner.temp }}/rrw-ollama-models
        run: |
          set -o pipefail
          mkdir -p evidence "$RUNNER_TEMP/rrw-ollama"
          curl -fsSL --max-time 180 https://ollama.com/download/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          sha256sum "$RUNNER_TEMP/ollama.tar.zst" > evidence/ollama-download-sha256.txt
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/rrw-ollama"
          export PATH="$RUNNER_TEMP/rrw-ollama/bin:$PATH"
          ollama serve > evidence/ollama-server.txt 2>&1 &
          OLLAMA_PID=$!
          trap 'kill "$OLLAMA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          printf 'GitHub-hosted CPU runner, not user laptop. All three unchanged fictional reviews.\nOLLAMA_NO_CLOUD=1\nOLLAMA_CONTEXT_LENGTH=4096\nOLLAMA_NUM_PARALLEL=1\n' > evidence/live-environment.txt
          lscpu >> evidence/live-environment.txt
          ollama --version >> evidence/live-environment.txt
          timeout 300 ollama pull gemma3:4b > evidence/model-download.txt 2>&1
          python rrw_evaluate.py --mode gemma --suite smoke --data-dir evidence/live-workspace | tee evidence/live-evaluation.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: prompt-grounding-live-${{ github.sha }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
