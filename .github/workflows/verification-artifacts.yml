name: Verification evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Snapshot tracked source
        run: |
          mkdir -p evidence
          git archive --format=zip --output=evidence/source.zip HEAD
          git rev-parse HEAD > evidence/commit.txt
      - name: Run deterministic tests
        run: |
          set -o pipefail
          python -m unittest -v 2>&1 | tee evidence/unit-tests.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
