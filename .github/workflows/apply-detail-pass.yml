name: Verify detail-aware replies
on:
  push:
    branches: [improve/detail-aware-replies]
    paths: ['.development/**', '.github/workflows/apply-detail-pass.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/improve/detail-aware-replies'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Capture unchanged baseline corpus before applying code
        run: |
          mkdir -p evidence
          python rrw_evaluate.py --mode offline --suite full --data-dir evidence/before-workspace > evidence/before.txt
      - name: Apply only fingerprint-verified application changes
        run: python .development/apply_details.py
      - name: Verify revised code and matched-corpus comparison
        run: |
          set -o pipefail
          python -m unittest -v 2>&1 | tee evidence/tests.txt
          python check_submission.py | tee evidence/development-check.txt
          node --check web/app.js
          git diff --check
          python rrw_evaluate.py --mode offline --suite full --data-dir evidence/after-workspace > evidence/after.txt
          BEFORE=$(find evidence/before-workspace/.rrw/evaluations -name 'eval-*.json' -print -quit)
          AFTER=$(find evidence/after-workspace/.rrw/evaluations -name 'eval-*.json' -print -quit)
          python scripts/compare_quality.py --before "$BEFORE" --after "$AFTER" --output evidence/detail-comparison.json > evidence/comparison-summary.txt
      - name: Commit verified application files to the development branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = json.loads(Path('.development/applied-files.json').read_text())
          assert all(not p.startswith('.') for p in names)
          subprocess.run(['git', 'add', '--', *names], check=True)
          PY
          git commit -m 'Improve complaint detail coverage and distinguish retrospective wording from promises'
          git push origin HEAD:improve/detail-aware-replies
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=evidence/tested-source.zip HEAD
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: detail-integration-${{ github.sha }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
  live:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Real Gemma smoke on fictional reviews, with every attempt retained
        timeout-minutes: 10
        env:
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_CONTEXT_LENGTH: '4096'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: ${{ runner.temp }}/rrw-ollama-models
        run: |
          set -o pipefail
          mkdir -p evidence "$RUNNER_TEMP/rrw-ollama"
          curl -fsSL --max-time 180 https://ollama.com/download/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          sha256sum "$RUNNER_TEMP/ollama.tar.zst" > evidence/ollama-download-sha256.txt
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/rrw-ollama"
          export PATH="$RUNNER_TEMP/rrw-ollama/bin:$PATH"
          ollama serve > evidence/ollama-server.txt 2>&1 &
          OLLAMA_PID=$!
          trap 'kill "$OLLAMA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          printf 'GitHub-hosted CPU runner, not user laptop. Fictional reviews only.\nOLLAMA_NO_CLOUD=1\nOLLAMA_CONTEXT_LENGTH=4096\nOLLAMA_NUM_PARALLEL=1\n' > evidence/live-environment.txt
          lscpu >> evidence/live-environment.txt
          ollama --version >> evidence/live-environment.txt
          timeout 300 ollama pull gemma3:4b > evidence/model-download.txt 2>&1
          python rrw_evaluate.py --mode gemma --suite smoke --data-dir evidence/live-workspace | tee evidence/live-evaluation.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: detail-live-${{ github.sha }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
