name: Integrate verified submission handoff

on:
  push:
    branches: [improve/submission-desk]
    paths: ['.development/**', '.github/workflows/apply-submission-desk.yml']

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/improve/submission-desk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Retain input source for transport verification
        run: |
          mkdir -p evidence
          git archive --format=zip --output=evidence/staged-source.zip HEAD
      - name: Apply exactly the locally tested source
        run: python .development/apply_submission.py
      - name: Verify before committing application changes
        run: |
          set -o pipefail
          python -m unittest -v 2>&1 | tee evidence/tests.txt
          python check_submission.py | tee evidence/development-check.txt
          node --check web/app.js
          node --check web/submission.js
          git diff --check
      - name: Commit application files to the development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add POST_FINAL.md README.md check_submission.py docs/OPERATOR_TRIAL.md docs/SUBMISSION_DESK.md rrw_submission.py rrw_web.py scripts/submission_browser_smoke.py test_submission_desk.py web/app.js web/index.html web/style.css web/submission.js
          git commit -m 'Integrate verified Submission Desk and private-data-aware judge packet'
          git push origin HEAD:improve/submission-desk
          git archive --format=zip --output=evidence/tested-source.zip HEAD
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: submission-integration-${{ github.sha }}
          path: evidence/
          retention-days: 7
