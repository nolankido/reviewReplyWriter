name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and regression tests
        run: python -m unittest -v
      - name: Check gallery and submission metadata
        run: python check_submission.py
      - name: Exercise offline CLI
        run: python review_reply.py --file examples/02-angry-cafe.txt --profile moes --offline --seed 0
