name: Integrate and verify Quality Lab
on:
  push:
    branches: [improve/quality-evidence]
    paths: ['.development/**', '.github/workflows/apply-quality-pass.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/improve/quality-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply and fingerprint locally verified changes
        run: |
          python .development/make_corpus.py
          python .development/apply_quality.py
      - name: Verify source before integration commit
        run: |
          mkdir -p evidence
          set -o pipefail
          python -m unittest -v 2>&1 | tee evidence/tests.txt
          python check_submission.py | tee evidence/development-check.txt
          node --check web/app.js
          git diff --check
      - name: Commit exact verified files to development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = list(json.loads(Path('.development/expected.json').read_text()))
          subprocess.run(['git', 'add', '--', *names], check=True)
          PY
          git commit -m 'Integrate fingerprint-verified Quality Lab and model evidence pipeline'
          git push origin HEAD:improve/quality-evidence
          git archive --format=zip --output=evidence/tested-source.zip HEAD
      - name: Full template evaluation with all failures retained
        run: python rrw_evaluate.py --mode offline --suite full --data-dir evidence/template-workspace > evidence/template-evaluation.txt
      - name: Bounded live Gemma smoke with fictional reviews only
        continue-on-error: true
        timeout-minutes: 12
        env:
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_CONTEXT_LENGTH: '4096'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: ${{ runner.temp }}/rrw-ollama-models
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rrw-ollama"
          curl -fsSL --max-time 180 https://ollama.com/download/ollama-linux-amd64.tar.zst | tar --zstd -xf - -C "$RUNNER_TEMP/rrw-ollama"
          export PATH="$RUNNER_TEMP/rrw-ollama/bin:$PATH"
          ollama serve > evidence/ollama-server.txt 2>&1 &
          OLLAMA_PID=$!
          trap 'kill "$OLLAMA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          printf 'Hosted GitHub Ubuntu CPU runner, not user laptop. Fictional reviews only.\nOLLAMA_NO_CLOUD=1\nOLLAMA_CONTEXT_LENGTH=4096\nOLLAMA_NUM_PARALLEL=1\n' > evidence/live-environment.txt
          lscpu >> evidence/live-environment.txt
          ollama --version >> evidence/live-environment.txt
          timeout 300 ollama pull gemma3:4b > evidence/model-download.txt 2>&1
          python rrw_evaluate.py --mode gemma --suite smoke --data-dir evidence/live-workspace | tee evidence/live-evaluation.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: quality-integration-${{ github.sha }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
