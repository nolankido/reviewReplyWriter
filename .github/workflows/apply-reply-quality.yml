name: Verify reply quality and record demo
on:
  push:
    branches: [improve/reply-quality-and-demo]
    paths: ['.development/**', '.github/workflows/apply-reply-quality.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/improve/reply-quality-and-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Record baseline before integration
        run: |
          mkdir -p evidence
          python rrw_evaluate.py --mode offline --suite full --data-dir evidence/before > evidence/before.txt
      - name: Integrate exact checked source and gallery
        run: python .development/integrate.py
      - name: Verify deterministic behavior before commit
        run: |
          set -o pipefail
          python -m unittest -v 2>&1 | tee evidence/tests.txt
          python check_submission.py | tee evidence/development-check.txt
          git diff --check
      - name: Commit only verified application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reply_safety.py review_reply.py rrw_evaluate.py test_review_reply.py test_evaluation_lab.py check_submission.py README.md examples/safety/
          git commit -m 'Integrate verified complaint coverage and conservative policy refinements'
          git push origin HEAD:improve/reply-quality-and-demo
          git archive --format=zip --output=evidence/tested-source.zip HEAD
      - name: Record full unchanged diagnostic set
        run: python rrw_evaluate.py --mode offline --suite full --data-dir evidence/after > evidence/after.txt
      - name: Install browser recording tools
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify browser and record template walkthrough
        run: |
          python scripts/browser_smoke.py --screenshots evidence/browser > evidence/browser-results.json
          python scripts/quality_browser_smoke.py --screenshots evidence/browser > evidence/quality-browser-results.json
          python scripts/record_demo.py --output evidence/demo-template > evidence/demo-template-result.json
      - name: Actual Gemma smoke and live walkthrough with fictional reviews
        continue-on-error: true
        timeout-minutes: 12
        env:
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_CONTEXT_LENGTH: '4096'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: ${{ runner.temp }}/rrw-ollama-models
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rrw-ollama"
          curl -fsSL --max-time 180 https://github.com/ollama/ollama/releases/download/v0.40.3/ollama-linux-amd64.tar.zst | tar --zstd -xf - -C "$RUNNER_TEMP/rrw-ollama"
          export PATH="$RUNNER_TEMP/rrw-ollama/bin:$PATH"
          ollama serve > evidence/ollama-server.txt 2>&1 &
          OLLAMA_PID=$!
          trap 'kill "$OLLAMA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          printf 'GitHub-hosted CPU runner; fictional fixtures only. OLLAMA_NO_CLOUD=1; context=4096; parallel=1.\n' > evidence/live-environment.txt
          lscpu >> evidence/live-environment.txt
          ollama --version >> evidence/live-environment.txt
          timeout 300 ollama pull gemma3:4b > evidence/model-download.txt 2>&1
          python rrw_evaluate.py --mode gemma --suite smoke --data-dir evidence/live | tee evidence/live-evaluation.txt
          python scripts/record_demo.py --live --output evidence/demo-live | tee evidence/demo-live-result.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reply-quality-evidence-${{ github.sha }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
